<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVG reklamace – mapy problémů</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background-image:
        linear-gradient(rgba(0,0,0,0.42), rgba(0,0,0,0.58)),
        url("Carvago-5_noc_still.jpg");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      background: rgba(10, 18, 35, 0.72);
      border-radius: 18px;
      padding: 40px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 52px;
      line-height: 1.1;
      font-weight: 800;
    }

    .subtitle {
      font-size: 22px;
      margin-bottom: 36px;
      color: rgba(255,255,255,0.92);
    }

    .links {
      display: grid;
      gap: 18px;
    }

    .map-link {
      display: block;
      padding: 22px 26px;
      background: linear-gradient(135deg, #2f67ff, #4a7dff);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 28px;
      font-weight: bold;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,0.22);
    }

    .map-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.28);
      background: linear-gradient(135deg, #2557e6, #3d70f0);
    }

    .note {
      margin-top: 30px;
      font-size: 16px;
      color: rgba(255,255,255,0.82);
    }

    @media (max-width: 768px) {
      .container {
        padding: 28px 22px;
      }

      h1 {
        font-size: 36px;
      }

      .subtitle {
        font-size: 18px;
      }

      .map-link {
        font-size: 22px;
        padding: 18px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CVG reklamace – mapy problémů</h1>

    <div class="subtitle">
      Rozcestník interaktivních map reklamací externích vozidel v CZ/SK
    </div>

    <div class="links">
      <a class="map-link" href="reklamace_externi_mapa_CZ_SK_v2_filtry.html">
        Mapa 1: Celková mapa problémů CZ/SK
      </a>

      <a class="map-link" href="reklamace_externi_mapa_CZ_SK_vsechny_znacky_filtry_v2_geokod_ok.html">
        Mapa 2: Všechny značky × kategorie problémů
      </a>
    </div>

    <div class="note">
      Mapy jsou založené na normalizovaném ZIP/PSČ a zobrazují intenzitu výskytu problémů podle lokalit.
    </div>
  </div>
</body>
</html>
